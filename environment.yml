# Conda environment for the scheduler package.
# Requires Python 3.12+.
# Install with: conda env create -f environment.yml
# Activate with: conda activate scheduler

name: scheduler
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.12
  - pip
  - astropy>=6.0
  - numpy>=1.24
  - plotly>=5.18
  - kaleido>=0.2.1
  - scipy>=1.10
  - requests
  - pip:
    - astroquery>=0.4.6
    - photutils>=1.7
    - pyephem>=9.99
# After creating the env, install this package in development mode from repo root:
#   conda activate scheduler && pip install -e .
