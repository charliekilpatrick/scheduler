[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler"
dynamic = ["version"]
description = "Telescope scheduling code for observatory target scheduling based on airmass and priority"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Charlie Kilpatrick", email = "ckilpatrick@northwestern.edu" }
]
keywords = ["astronomy", "scheduling", "telescope", "observatory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=6.0",
    "astroquery>=0.4.6",
    "kaleido>=0.2.1",
    "numpy>=1.24",
    "photutils>=1.7",
    "plotly>=5.18",
    "pyephem>=9.99",
    "requests>=2.28",
    "scipy>=1.10",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.86",
    "google-auth-oauthlib>=1.0",
    "protobuf>=4.21",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
create-schedule = "scheduler.run:main"
scheduler-convert-gw = "scheduler.gw_convert:main_convert"
scheduler-filter-tiles = "scheduler.gw_convert:main_filter"
scheduler-probs = "scheduler.gw_convert:main_probs"
scheduler-finders = "scheduler.finders:main"
scheduler-check-schedule = "scheduler.schedule_check:main"
scheduler-build-date = "scheduler.build:main"
scheduler-sample-logs = "scheduler.common.log_format:main"

[project.urls]
Repository = "https://github.com/ckilpatrick/scheduler"

[tool.setuptools.packages.find]
where = ["."]
include = ["scheduler*"]

[tool.setuptools.dynamic]
version = { attr = "scheduler.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["scheduler"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
